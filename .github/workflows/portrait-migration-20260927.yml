name: One-shot controlled portrait migration
on:
  push:
    paths:
      - ".github/workflows/portrait-migration-20260927.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Acquire and verify portrait assets
        shell: python
        run: |
          import hashlib, json, pathlib, struct, urllib.parse, urllib.request, time

          assets = [
            ("P08","P08_S.png"),
            ("C96","C96_S.png"),
            ("P7","P7_S.png"),
            ("Mk23","Mk23_S.png"),
            ("USP Compact","USP_Compact_S.png"),
            ("HK45","HK45_S.png"),
            ("P22","P22_S.png"),
            ("P30","P30_S.png"),
            ("C-93","C-93_S.png"),
            ("WKp","WKp_S.png"),
            ("VP9","VP9_S.png"),
            ("P2000","P2000_S.png"),
            ("MP5","MP5_S.png"),
            ("MP7","MP7_S.png"),
            ("MPL","MPL_S.png"),
            ("MPK","MPK_S.png"),
            ("G41","G41_S.png"),
            ("HK33","HK33_S.png"),
            ("VRB","VRB_S.png"),
            ("G43","G43_S.png"),
            ("PSG-1","PSG-1_S.png"),
            ("G28","G28.png"),
            ("PzB 39","PzB_39_S.png"),
            ("R93","R93_S.png"),
            ("SSG 3000","SSG_3000_S.png"),
            ("SL8","SL8_S.png"),
            ("MG42","MG42_S.png"),
            ("MG34","MG34_S.png"),
            ("MG3","MG3_S.png"),
            ("MG5","MG5_S.png"),
            ("FG42","FG42_S.png"),
            ("HK23","HK23_S.png"),
            ("HK21","HK21_S.png"),
            ("MG36","MG36_S.png"),
            ("MG15","MG15_S.png"),
            ("CAWS","CAWS_S.png"),
          ]

          out = pathlib.Path("avatars")
          out.mkdir(exist_ok=True)
          manifest = {
            "migration":"portrait-migration-20260927",
            "source_class":"IOP Wiki trusted community game-asset mirror",
            "acquisition_transport":"images.weserv.nl fetch proxy used only to overcome IOP Wiki's automated-client 403; source URL preserved per asset",
            "policy":"controlled copies of the live register's accepted runtime portrait candidates; MP40 and Persicaria excluded",
            "assets":[]
          }

          for identity, filename in assets:
            source_url = "https://iopwiki.com/wiki/Special:Redirect/file/" + urllib.parse.quote(filename, safe="_-.")
            proxy_url = "https://images.weserv.nl/?url=" + urllib.parse.quote(source_url, safe="") + "&output=png"
            last_error = None
            for attempt in range(3):
              try:
                req = urllib.request.Request(proxy_url, headers={"User-Agent":"Mozilla/5.0 Oberkommando-Portrait-Migration/1.0","Accept":"image/png,image/*;q=0.9,*/*;q=0.1"})
                with urllib.request.urlopen(req, timeout=60) as resp:
                  data = resp.read()
                  resolved_url = resp.geturl()
                  content_type = resp.headers.get("Content-Type","")
                if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise RuntimeError(f"not PNG ({content_type}) from {resolved_url}")
                if len(data) < 1024:
                  raise RuntimeError(f"implausibly small PNG ({len(data)} bytes)")
                break
              except Exception as exc:
                last_error = exc
                if attempt == 2:
                  raise RuntimeError(f"{identity}/{filename}: acquisition failed after retries: {exc}") from exc
                time.sleep(2 * (attempt + 1))
            width, height = struct.unpack(">II", data[16:24])
            if width <= 0 or height <= 0:
              raise RuntimeError(f"{identity}: invalid PNG dimensions {width}x{height}")
            dest = out / filename
            dest.write_bytes(data)
            manifest["assets"].append({
              "identity":identity,
              "filename":filename,
              "source_url":source_url,
              "acquisition_url":proxy_url,
              "sha256":hashlib.sha256(data).hexdigest(),
              "bytes":len(data),
              "width":width,
              "height":height
            })

          pathlib.Path("avatars/portrait_migration_20260927.json").write_text(
            json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
            encoding="utf-8"
          )
      - name: Commit controlled assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Oberkommando Portrait Migration"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/portrait-migration-20260927.yml
          git add avatars
          git commit -m "Complete controlled T-Doll portrait migration"
          git push origin HEAD:main
